<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPlanner - Set New Password</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge">
                🔒
            </div>
            <h2>Set New Password</h2>
            <p class="text-muted" style="font-size: 14px;">Enter your new credentials below to restore account access.</p>
        </div>

        <form id="resetPasswordForm">
            <!-- Manual token fields if opened directly without URL query parameters -->
            <div id="manualTokenFields" style="display: none;">
                <div class="form-group">
                    <label for="resetUid" class="form-label">User ID (from Email)</label>
                    <input
                        type="text"
                        id="resetUid"
                        class="form-control-theme"
                        placeholder="e.g. MQ"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="resetToken" class="form-label">Reset Token (from Email)</label>
                    <input
                        type="text"
                        id="resetToken"
                        class="form-control-theme"
                        placeholder="e.g. c39z8x-..."
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="new_password" class="form-label">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    class="form-control-theme"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group mb-4">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    class="form-control-theme"
                    placeholder="••••••••"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div id="message" class="mb-3"></div>

            <button type="submit" id="resetSubmitBtn" class="btn-theme btn-primary-theme w-100 py-2 mb-4" style="font-size: 15px;">
                Reset Password
            </button>
        </form>

        <div class="text-center" style="font-size: 13.5px; color: var(--text-muted);">
            Back to <a href="login.html" style="font-weight: 700;">Sign In</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // Extract parameters on load
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get("uid");
    const token = urlParams.get("token");

    if (uid && token) {
        document.getElementById("resetUid").value = uid;
        document.getElementById("resetToken").value = token;
        document.getElementById("manualTokenFields").style.display = "none";
    } else {
        // If opened without query params, show manual inputs so user can paste token from email
        document.getElementById("manualTokenFields").style.display = "block";
    }
</script>
</body>
</html>
