<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <title>PocketPlanner - Modern Financial Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=12">
</head>
<body>

<div class="auth-wrapper">
    <div class="surface-card text-center" style="max-width: 580px; padding: 48px 36px; border-radius: var(--radius-xl);">
        <div class="sidebar-logo mx-auto mb-4" style="width: 56px; height: 56px; font-size: 26px; border-radius: 16px;">
            💳
        </div>

        <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em;">
            Pocket<span style="color: var(--primary);">Planner</span>
        </h1>

        <p style="font-size: 16px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px;">
            Intelligent financial planning, expense tracking, smart goal auto-splits, and real-time cash flow analytics.
        </p>

        <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <span class="pill-badge badge-indigo">⚡ Smart Insights</span>
            <span class="pill-badge badge-emerald">🎯 Auto-Split Goals</span>
            <span class="pill-badge badge-amber">📊 Category Reports</span>
            <span class="pill-badge badge-cyan">📅 Daily Calendar</span>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <a href="login.html" class="btn-theme btn-primary-theme px-4 py-2" id="mainCtaBtn" style="font-size: 15px;">
                Get Started →
            </a>
            <a href="login.html" class="btn-theme btn-secondary-theme px-4 py-2" id="loginBtn" style="font-size: 15px;">
                Sign In
            </a>
        </div>
    </div>
</div>

<script src="js/api.js?v=12"></script>
<script>
    const token = localStorage.getItem("access_token");
    if (token) {
        document.getElementById("mainCtaBtn").textContent = "Open Dashboard →";
        document.getElementById("mainCtaBtn").href = "dashboard.html";
        document.getElementById("loginBtn").style.display = "none";
    }
</script>
</body>
</html>
