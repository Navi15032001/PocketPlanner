<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPlanner - Create Account</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge">
                💳
            </div>
            <h2>Create Account</h2>
            <p class="text-muted" style="font-size: 14px;">Start planning your financial future today</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    class="form-control-theme"
                    placeholder="Choose a username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    class="form-control-theme"
                    placeholder="name@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-control-theme"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control-theme"
                    placeholder="Re-enter password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div id="message" class="mb-3"></div>

            <button type="submit" class="btn-theme btn-primary-theme w-100 py-2 mb-4" style="font-size: 15px;">
                Create Account
            </button>
        </form>

        <div class="text-center" style="font-size: 13.5px; color: var(--text-muted);">
            Already have an account?
            <a href="login.html" style="font-weight: 700;">Sign in</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
