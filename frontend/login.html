<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <title>PocketPlanner - Sign In</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=14">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge">
                💳
            </div>
            <h2>Welcome back</h2>
            <p class="text-muted" style="font-size: 14px;">Sign in to access your financial dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    class="form-control-theme"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label mb-0">Password</label>
                    <a href="forgot-password.html" style="font-size: 12.5px; font-weight: 600;">Forgot password?</a>
                </div>
                <input
                    type="password"
                    id="password"
                    class="form-control-theme"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div id="message" class="mb-3"></div>

            <button type="submit" class="btn-theme btn-primary-theme w-100 py-2 mb-4" style="font-size: 15px;">
                Sign In
            </button>
        </form>

        <div class="text-center" style="font-size: 13.5px; color: var(--text-muted);">
            Don't have an account?
            <a href="register.html" style="font-weight: 700;">Create an account</a>
        </div>
    </div>
</div>

<script src="js/api.js?v=14"></script>
<script src="js/auth.js"></script>
</body>
</html>
