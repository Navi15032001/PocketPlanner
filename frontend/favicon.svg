<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Top Highlight -->
  <path d="M 6 34 C 6 18.5 18.5 6 34 6 L 94 6 C 109.5 6 122 18.5 122 34 L 122 56 L 6 56 Z" fill="white" opacity="0.12"/>

  <!-- Main Wallet Body -->
  <rect x="24" y="34" width="80" height="60" rx="14" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Navy Accent Stripe -->
  <rect x="24" y="46" width="80" height="14" fill="#1e1b4b"/>

  <!-- Golden Coin Clasp Lock -->
  <circle cx="86" cy="64" r="13" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="86" cy="64" r="4.5" fill="#fef3c7"/>

  <!-- Emerald Growth Spark -->
  <polygon points="106,16 108,22 114,24 108,26 106,32 104,26 98,24 104,22" fill="#10b981"/>
</svg>
