<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <title>PocketPlanner - Forgot Password</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=14">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge">
                🔑
            </div>
            <h2>Reset Password</h2>
            <p class="text-muted" style="font-size: 14px;">Enter your registered email address or username to receive a password reset link.</p>
        </div>

        <form id="forgotPasswordForm">
            <div class="form-group mb-4">
                <label for="email" class="form-label">Email Address or Username</label>
                <input
                    type="text"
                    id="email"
                    class="form-control-theme"
                    placeholder="name@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div id="message" class="mb-3"></div>

            <button type="submit" class="btn-theme btn-primary-theme w-100 py-2 mb-4" style="font-size: 15px;">
                Send Reset Link
            </button>
        </form>

        <div class="text-center" style="font-size: 13.5px; color: var(--text-muted);">
            Remembered your password?
            <a href="login.html" style="font-weight: 700;">Back to Sign In</a>
        </div>
    </div>
</div>

<script src="js/api.js?v=14"></script>
<script src="js/auth.js"></script>
</body>
</html>
